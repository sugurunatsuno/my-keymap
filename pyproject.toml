[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyboard-layout-lab"
version = "0.1.0"
description = "Local-first keyboard layout research and hand motion capture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
camera = ["opencv-python>=4.8,<5", "mediapipe>=0.10,<1", "numpy>=1.24"]
japanese = ["pykakasi>=2.3,<3"]
dev = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
